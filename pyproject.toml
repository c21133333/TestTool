[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requesttool"
version = "0.1.0"
description = "Web-first API testing platform with FastAPI and React."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = ["cli", "scaffold"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "alembic>=1.14.1,<2.0.0",
  "requests>=2.31",
  "jsonpath-ng>=1.6.1",
  "openpyxl>=3.1.2",
  "fastapi>=0.115.12,<1.0.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.3.4,<3.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx>=0.28.1,<1.0.0"]

[project.scripts]
requesttool = "requesttool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
